# =============================================================================
# Nginx 配置 — AKQuant Kalman 报告服务
# 部署路径: /etc/nginx/sites-enabled/kalman-reports
#
# 功能: 监听 8888 端口，提供静态文件服务 + 目录索引
# =============================================================================
server {
    listen 8888;
    server_name _;

    root /var/www/reports;
    index index.html;

    # 字符集
    charset utf-8;

    # 访问日志 (可选关闭以减少磁盘 IO)
    access_log /var/log/nginx/kalman-reports-access.log;
    error_log  /var/log/nginx/kalman-reports-error.log;

    # 大文件传输优化 (K 线图约 5MB)
    sendfile on;
    tcp_nopush on;

    # 允许 Plotly 图表需要的 JS 资源
    location / {
        # 允许目录浏览 (方便直接查看所有报告)
        autoindex on;
        autoindex_exact_size off;   # 显示人类可读的文件大小
        autoindex_localtime on;     # 使用本地时间

        # 缓存策略: HTML 不缓存 (实盘报告每日更新), 静态资源缓存 1 小时
        location ~ \.html$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff";
        }

        location ~ \.(js|css|png|jpg|svg)$ {
            expires 1h;
            add_header Cache-Control "public";
        }
    }

    # 安全限制: 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}
