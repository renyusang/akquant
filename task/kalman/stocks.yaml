# =============================================================================
# 每日信号监控配置文件
# 用法: python daily_signal.py
# =============================================================================

# 共享策略参数（股票和 ETF 共用）
strategy:
  kalman_q_price: 0.0001
  kalman_q_vel: 0.00001
  kalman_r: 0.01
  entry_threshold: 0.02
  exit_threshold: 0.005
  stop_loss_pct: 0.05
  use_price_signal: true
  use_velocity_signal: true
  trend_filter_enabled: true
  trend_confirm_bars: 1
  trend_bear_pct: 0.30
  downtrend_entry: 0.03
  atr_adaptive_exit_enabled: true   # NATR自适应退出宽度(2026-08-04, 全池+组合验证最优)
  exit_atr_factor: 1.0          # 退出阈值=max(0.5%, 1.0×NATR), 高波动期放宽避免被洗出
  sar_exit_enabled: false       # SAR跟踪止损(实证无效: 0.5%回归先触发, 保持关闭)

# 股票池
stock:
  initial_cash: 200000
  max_positions: 5
  single_position_pct: 0.20

# ETF 池
etf:
  initial_cash: 100000
  max_positions: 5
  single_position_pct: 0.20

# 数据缓存
data_years: 2

