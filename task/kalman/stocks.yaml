# =============================================================================
# 每日信号监控配置文件
# 用法: python daily_signal.py
# =============================================================================

# 全局默认策略参数（可被个股覆盖）
defaults:
  # 资金管理
  initial_cash: 200000           # 初始资金
  max_positions: 5               # 最多同时持有股票数
  single_position_pct: 0.20      # 单只股票最大仓位比例

  # 卡尔曼滤波器
  kalman_q_price: 0.0001
  kalman_q_vel: 0.00001
  kalman_r: 0.01

  # 信号阈值
  entry_threshold: 0.02
  exit_threshold: 0.005
  stop_loss_pct: 0.05
  use_price_signal: true
  use_velocity_signal: true

  # 趋势过滤
  trend_filter_enabled: true
  trend_confirm_bars: 1
  trend_bear_pct: 0.30
  downtrend_entry: 0.03

# 数据缓存天数（下载近 N 年的日线数据用于计算指标）
data_years: 2

# 监控列表
#   type: "stock"(默认) 或 "etf"(场内基金)
