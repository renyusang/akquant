# =============================================================================
# 每日信号监控配置文件
# 用法: python daily_signal.py
# =============================================================================
#
# 变更记录:
#   2026-08-21  股票池现金 200000 → 300000 (备份 stocks.yaml.bak_20260821)
#     原因: 高价股(如新易盛 ¥442)在上涨趋势 95%×20% 口径下目标金额
#           300000×0.19=¥57,000 可买 1 手(¥44,200); 原 20 万仅 ¥38,000 不够
#     注意: 单只上限同步 4 万→6 万(20%×新现金); 下跌趋势 30% 仓位下
#           1 手仍需 ¥736,667 现金(30万仍买不起, 属设计限制)
#     口径影响: 总收益率 = 总盈亏/¥400,000(股票池30万+ETF池10万) 被稀释,
#               权益曲线起点抬升至 40 万; 组合回测口径同步变化
#   2026-08-14  股票池科学替换: 29 只人工 → 25 只(双窗口筛选+行业分散,
#               备份 stocks.yaml.bak_20260814)
# 监控列表当前构成(2026-08-21): 股票 25 只 + ETF 24 只, 见下方 watchlist

# 共享策略参数（股票和 ETF 共用）
strategy:
  kalman_q_price: 0.0001
  kalman_q_vel: 0.00001
  kalman_r: 0.01
  entry_threshold: 0.02
  exit_threshold: 0.005
  stop_loss_pct: 0.05
  use_price_signal: true
  use_velocity_signal: true
  trend_filter_enabled: true
  trend_confirm_bars: 1
  trend_bear_pct: 0.30
  downtrend_entry: 0.04       # 下跌趋势入场偏离(2026-09-22 批次2研究: 3%→4%,
                              # 股票池全区间 +279.3%→+295.9%、夏普1.42→1.46、
                              # 回撤仅 -14.8%→-15.7%; IS/OOS 双侧改善、无单年依赖。
                              # ⚠️ ETF 池反向(-23.0%→-35.0%)但仅 1/4 资金且非单调)
  priority_mode: deviation      # 名额优先级 = 偏离降序(与实盘 daily_signal 同口径, 2026-09-17 对齐)
  atr_adaptive_exit_enabled: false  # 2026-08-26 关闭: 修复引擎下 -34.5pp(见 kalman.md);
                                    # 8-04 启用依据(旧引擎+14.1pp)因回测代码缺陷失真
  exit_atr_factor: 1.0          # 退出阈值=max(0.5%, 1.0×NATR)(现关闭, 保留参数)
  sar_exit_enabled: false       # SAR跟踪止损(机制性失效: 追赶慢于回归阈值, 永不触发)
  mfi_filter_enabled: true      # MFI超买过滤(2026-08-25启用; 2026-09-17 新语义复核: 收益+4.0pp, 夏普1.34→1.43/回撤-19.0%→-14.7%; 旧+57.1pp 为旧语义口径)
  mfi_overbought: 70.0          # MFI>70抑制买入(资金超买追高过滤)
  trailing_stop_pct: 0.04       # 峰值回撤止盈(2026-08-27启用5%; 2026-09-22 批次3研究改为 4%:
                                # 4% 在 IS/OOS/全区间三处均优于 5% —— 全区间 +295.9%→+323.4%、
                                # 夏普 1.46→1.59、回撤 -15.7%→-15.2%; 年度最大年贡献 27%(无单年依赖);
                                # ETF 池仅 -2.9pp(1/4 资金))
                                # 注: 0.03 更激进但 2020 独占 71% 增益、2021-23 连续为负, 不采纳
                                # 持仓峰值回撤≥5%卖出(移动止盈, 趋势中不干预)
  # ma_exit_enabled: true       # 均线止盈(可选, 默认关): +61.6pp但回撤-19%(-9.6%→-19.0%),
  # ma_exit_period: 10          # 夏普1.57→1.25, 年度5/7年改善无大幅回吐(2026-08-27研究)
                                # 需更高收益可启用; 风险调整最优仍为 trailing 5%

# 股票池
stock:
  initial_cash: 300000    # 2026-08-21: 200000→300000 (高价股可买, 见头部变更记录)
  max_positions: 5
  single_position_pct: 0.20

# ETF 池
etf:
  initial_cash: 100000
  max_positions: 5
  single_position_pct: 0.20

# 数据缓存
data_years: 2

