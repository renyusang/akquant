# =============================================================================
# 每日信号监控配置文件
# 用法: python daily_signal.py
# =============================================================================
#
# 变更记录:
#   2026-08-21  股票池现金 200000 → 300000 (备份 stocks.yaml.bak_20260821)
#     原因: 高价股(如新易盛 ¥442)在上涨趋势 95%×20% 口径下目标金额
#           300000×0.19=¥57,000 可买 1 手(¥44,200); 原 20 万仅 ¥38,000 不够
#     注意: 单只上限同步 4 万→6 万(20%×新现金); 下跌趋势 30% 仓位下
#           1 手仍需 ¥736,667 现金(30万仍买不起, 属设计限制)
#     口径影响: 总收益率 = 总盈亏/¥400,000(股票池30万+ETF池10万) 被稀释,
#               权益曲线起点抬升至 40 万; 组合回测口径同步变化
#   2026-08-14  股票池科学替换: 29 只人工 → 25 只(双窗口筛选+行业分散,
#               备份 stocks.yaml.bak_20260814)
# 监控列表当前构成(2026-08-21): 股票 25 只 + ETF 24 只, 见下方 watchlist

# 共享策略参数（股票和 ETF 共用）
strategy:
  kalman_q_price: 0.0001
  kalman_q_vel: 0.00001
  kalman_r: 0.01
  entry_threshold: 0.02
  exit_threshold: 0.005
  stop_loss_pct: 0.05
  use_price_signal: true
  use_velocity_signal: true
  trend_filter_enabled: true
  trend_confirm_bars: 1
  trend_bear_pct: 0.30
  downtrend_entry: 0.03
  atr_adaptive_exit_enabled: true   # NATR自适应退出宽度(2026-08-04, 全池+组合验证最优)
  exit_atr_factor: 1.0          # 退出阈值=max(0.5%, 1.0×NATR), 高波动期放宽避免被洗出
  sar_exit_enabled: false       # SAR跟踪止损(实证无效: 0.5%回归先触发, 保持关闭)
  mfi_filter_enabled: true      # MFI超买过滤(2026-08-25启用, 修复超买后组合+57.1pp)
  mfi_overbought: 70.0          # MFI>70抑制买入(资金超买追高过滤)

# 股票池
stock:
  initial_cash: 300000    # 2026-08-21: 200000→300000 (高价股可买, 见头部变更记录)
  max_positions: 5
  single_position_pct: 0.20

# ETF 池
etf:
  initial_cash: 100000
  max_positions: 5
  single_position_pct: 0.20

# 数据缓存
data_years: 2

